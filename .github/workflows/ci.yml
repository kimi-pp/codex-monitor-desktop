name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Codex project scope tests
        run: npm run test:codex-project-scope

      - name: Resident agent registry tests
        run: npm run test:codex-resident-agent-registry

      - name: Runtime status tests
        run: npm run test:codex-runtime-status

      - name: Provider privacy tests
        run: npm run test:codex-provider-privacy

      - name: Packaged asset path tests
        run: npm run test:packaged-asset-paths

      - name: Public repository boundary tests
        run: npm run test:public-repo-boundary

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
